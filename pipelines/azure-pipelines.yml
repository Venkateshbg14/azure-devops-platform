trigger:
  branches:
    include:
      - main
  paths:
    include:
      - app/*
      - k8s/*
      - pipelines/*

pool:
  vmImage: ubuntu-24.04

variables:
  azureServiceConnection: sc-azure-oidc
  acrName: acrdevopsplatww279
  imageName: devops-app
  resourceGroup: rg-devopsplat-eastus
  aksName: aks-devopsplat-eastus

stages:
  - stage: Build
    displayName: Build and push image
    jobs:
      - job: BuildPush
        steps:
          - task: AzureCLI@2
            displayName: Build image and push to ACR
            inputs:
              azureSubscription: $(azureServiceConnection)
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                set -euo pipefail
                TAG="${BUILD_SOURCEVERSION:0:7}"
                IMAGE="$(acrName).azurecr.io/$(imageName):${TAG}"
                az acr login --name $(acrName)
                docker build -t "${IMAGE}" app
                docker push "${IMAGE}"
                echo "Pushed ${IMAGE}"

  - stage: VerifyCluster
    displayName: Verify AKS access
    dependsOn: Build
    jobs:
      - job: Verify
        steps:
          - task: AzureCLI@2
            displayName: Get kubeconfig and list nodes
            inputs:
              azureSubscription: $(azureServiceConnection)
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                set -euo pipefail
                az aks get-credentials --resource-group $(resourceGroup) --name $(aksName) --overwrite-existing
                kubectl get nodes

  - stage: Deploy
    displayName: Deploy to AKS
    dependsOn: VerifyCluster
    jobs:
      - job: Deploy
        steps:
          - task: AzureCLI@2
            displayName: Render manifests and deploy
            inputs:
              azureSubscription: $(azureServiceConnection)
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                set -euo pipefail
                TAG="${BUILD_SOURCEVERSION:0:7}"
                IMAGE="$(acrName).azurecr.io/$(imageName):${TAG}"
                az aks get-credentials --resource-group $(resourceGroup) --name $(aksName) --overwrite-existing
                sed -e "s|IMAGE_PLACEHOLDER|${IMAGE}|" -e "s|VERSION_PLACEHOLDER|${TAG}|" k8s/deployment.yaml > /tmp/deployment.yaml
                kubectl apply -f k8s/namespace.yaml
                kubectl apply -f /tmp/deployment.yaml -f k8s/service.yaml -f k8s/hpa.yaml
                kubectl -n demo rollout status deployment/devops-app --timeout=180s
                kubectl -n demo get pods,svc